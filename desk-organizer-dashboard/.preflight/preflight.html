<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/*
 * Desk Organizer Dashboard — Design Tokens
 * Dark-mode control-center aesthetic inspired by Windows desktop widgets
 */

:root {
  /* Brand prefix: do */
  --do-background: #0f1117;
  --do-foreground: #e8eaed;
  --do-card: #1a1d27;
  --do-card-foreground: #e8eaed;
  --do-popover: #22252f;
  --do-popover-foreground: #e8eaed;
  --do-primary: #6c8cff;
  --do-primary-foreground: #ffffff;
  --do-muted: #6b7280;
  --do-muted-foreground: #9ca3af;
  --do-border: #2a2d3a;
  --do-input: #1e2130;
  --do-ring: #6c8cff;
  --do-radius-sm: 6px;
  --do-radius-md: 10px;
  --do-radius-lg: 16px;

  /* Support hues */
  --do-success: #34d399;
  --do-warning: #fbbf24;
  --do-danger: #f87171;
  --do-info: #60a5fa;

  /* Typography */
  --do-font-display: "DM Sans", sans-serif;
  --do-font-body: "DM Sans", sans-serif;
  --do-font-mono: "JetBrains Mono", monospace;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--do-background);
    --color-foreground: var(--do-foreground);
    --color-card: var(--do-card);
    --color-card-foreground: var(--do-card-foreground);
    --color-popover: var(--do-popover);
    --color-popover-foreground: var(--do-popover-foreground);
    --color-primary: var(--do-primary);
    --color-primary-foreground: var(--do-primary-foreground);
    --color-muted: var(--do-muted);
    --color-muted-foreground: var(--do-muted-foreground);
    --color-border: var(--do-border);
    --color-input: var(--do-input);
    --color-ring: var(--do-ring);
    --radius-sm: var(--do-radius-sm);
    --radius-md: var(--do-radius-md);
    --radius-lg: var(--do-radius-lg);
  }
  @layer base {
    body { background: var(--do-background); color: var(--do-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">

      .border-card-foreground { border-color: var(--do-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--do-card-foreground); }
      .bg-popover { background-color: var(--do-popover); }

      .border-popover-foreground { border-color: var(--do-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--do-popover-foreground); }
      .bg-primary { background-color: var(--do-primary); }
      .text-primary { color: var(--do-primary); }
      .border-primary { border-color: var(--do-primary); }
      .ring-primary { --tw-ring-color: var(--do-primary); }
      .bg-primary-foreground { background-color: var(--do-primary-foreground); }
      .text-primary-foreground { color: var(--do-primary-foreground); }
      .border-primary-foreground { border-color: var(--do-primary-foreground); }

      .bg-muted { background-color: var(--do-muted); }

      .border-muted-foreground { border-color: var(--do-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--do-muted-foreground); }
      .bg-border { background-color: var(--do-border); }
      .text-border { color: var(--do-border); }
      .border-border { border-color: var(--do-border); }
      .ring-border { --tw-ring-color: var(--do-border); }
      .bg-input { background-color: var(--do-input); }
      .text-input { color: var(--do-input); }
      .border-input { border-color: var(--do-input); }

      .bg-ring { background-color: var(--do-ring); }
      .text-ring { color: var(--do-ring); }
      .border-ring { border-color: var(--do-ring); }
      .ring-ring { --tw-ring-color: var(--do-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
