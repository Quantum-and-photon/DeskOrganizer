<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面围栏</title>
    <style id="theme-vars">
/* DeskOrganizer — Anthropic Brand CSS */
:root {
  /* ── Brand Colors ── */
  --color-dark: #141413;
  --color-light: #faf9f5;
  --color-mid-gray: #b0aea5;
  --color-light-gray: #e8e6dc;
  --color-orange: #d97757;
  --color-blue: #6a9bcc;
  --color-green: #788c5d;

  /* ── Primary palette tints ── */
  --color-primary: #d97757;
  --color-primary-hover: #c4683f;
  --color-primary-light: #f5e0d6;
  --color-primary-bg: #fdf8f5;

  /* ── Semantic state colors ── */
  --state-success: #788c5d;
  --state-warning: #d97757;
  --state-error: #c75050;
  --state-info: #6a9bcc;

  /* ── Surface system ── */
  --surface-0: #faf9f5;
  --surface-1: #f3f1eb;
  --surface-2: #e8e6dc;
  --surface-3: #d4d2c8;
  --surface-dark: #1e1e1c;
  --surface-dark-elevated: #2a2a27;

  /* ── Text ── */
  --text-primary: #141413;
  --text-secondary: #6b6963;
  --text-tertiary: #b0aea5;
  --text-on-dark: #faf9f5;
  --text-on-accent: #faf9f5;

  /* ── Borders ── */
  --border-default: #e8e6dc;
  --border-strong: #d4d2c8;
  --border-focus: #d97757;

  /* ── Typography ── */
  --font-display: 'Poppins', 'Arial', sans-serif;
  --font-body: 'Lora', 'Georgia', serif;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* ── Spacing ── */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadows (alpha ≤ 0.05 for static) ── */
  --shadow-sm: 0 1px 2px rgba(20, 20, 19, 0.04);
  --shadow-md: 0 2px 8px rgba(20, 20, 19, 0.04);
  --shadow-lg: 0 4px 16px rgba(20, 20, 19, 0.05);
  --shadow-float: 0 8px 32px rgba(20, 20, 19, 0.12);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

/* Dark mode tokens */
html.dark {
  --surface-0: #141413;
  --surface-1: #1e1e1c;
  --surface-2: #2a2a27;
  --surface-3: #3a3a36;
  --text-primary: #faf9f5;
  --text-secondary: #b0aea5;
  --text-tertiary: #6b6963;
  --border-default: #2a2a27;
  --border-strong: #3a3a36;
  --primary-light: #3d2a20;
  --primary-bg: #221a14;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      /* Fence hover tooltip */
      .fence-card:hover .fence-tooltip { opacity: 1 !important; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-body);">
    <main class="flex min-h-screen">

      <!-- ── Left Sidebar ── -->
      <aside class="w-60 shrink-0 border-r flex flex-col" style="border-color: var(--border-default); background: var(--surface-1);">
        <!-- App Logo -->
        <div class="px-6 py-5 border-b" style="border-color: var(--border-default);">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--color-primary);">
              <i data-lucide="layout-grid" class="w-4 h-4" style="color: var(--text-on-accent);"></i>
            </div>
            <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-display); color: var(--text-primary);">DeskOrganizer</span>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-3 py-4 flex flex-col gap-1">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);" data-dom-id="nav-dashboard">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>主界面</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium" style="font-family: var(--font-display); background: var(--color-primary-bg); color: var(--color-primary);" data-active="true">
            <i data-lucide="grid-3x3" class="w-4 h-4"></i>
            <span>桌面围栏</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);" data-dom-id="nav-search">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>全局搜索</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);" data-dom-id="nav-notes">
            <i data-lucide="sticky-note" class="w-4 h-4"></i>
            <span>便签</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>设置</span>
          </a>
        </nav>

        <!-- Sidebar footer -->
        <div class="px-6 py-4 border-t" style="border-color: var(--border-default);">
          <span class="text-xs" style="color: var(--text-tertiary);">v1.0.0</span>
        </div>
      </aside>

      <!-- ── Main Content Area ── -->
      <div class="flex-1 flex flex-col overflow-hidden">

        <!-- ── Top Bar ── -->
        <header class="h-14 shrink-0 border-b flex items-center justify-between px-6" style="border-color: var(--border-default); background: var(--surface-0);">
          <div class="flex items-center gap-3">
            <span class="text-base font-semibold" style="font-family: var(--font-display); color: var(--text-primary);">桌面围栏</span>
          </div>
          <div class="flex items-center gap-4">
            <!-- Search quick-access -->
            <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs transition-colors duration-150" style="border-color: var(--border-default); background: var(--surface-1); color: var(--text-secondary);">
              <i data-lucide="search" class="w-3.5 h-3.5"></i>
              <span>快速搜索</span>
              <kbd class="px-1.5 py-0.5 rounded" style="background: var(--surface-2); color: var(--text-tertiary); font-size: 10px;">Alt+Space</kbd>
            </button>
            <!-- User avatar -->
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold" style="background: var(--color-primary); color: var(--text-on-accent); font-family: var(--font-display);">
              U
            </div>
          </div>
        </header>

        <!-- ── Content Split: Desktop Area + Right Panel ── -->
        <div class="flex-1 flex overflow-hidden">

          <!-- ── Desktop Simulation Area ── -->
          <div class="flex-1 relative overflow-hidden" style="background: var(--surface-2);">

            <!-- Dot-grid pattern background (soul element) -->
            <div class="absolute inset-0" style="background-image: radial-gradient(circle, var(--border-strong) 1px, transparent 1px); background-size: 24px 24px; opacity: 0.5;"></div>

            <!-- Fence containers layer -->
            <div class="relative w-full h-full p-6 lg:p-8 flex flex-col gap-6" style="min-height: 480px;">

              <!-- ── Fence 1: 工作文件 (expanded, selected) ── -->
              <div class="fence-card relative rounded-lg border flex flex-col" style="background: var(--surface-0); border-color: var(--border-default); width: 340px; height: 240px; box-shadow: var(--shadow-lg);">
                <!-- Accent stripe -->
                <div class="absolute top-0 left-0 w-1 h-full rounded-l-lg" style="background: var(--color-primary);"></div>
                <!-- Title bar -->
                <div class="flex items-center justify-between px-4 py-2 border-b cursor-move" style="border-color: var(--border-default);">
                  <div class="flex items-center gap-2">
                    <i data-lucide="folder" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    <span class="text-sm font-medium" style="font-family: var(--font-display); color: var(--text-primary);">工作文件</span>
                  </div>
                  <div class="flex items-center gap-1">
                    <button class="w-6 h-6 rounded flex items-center justify-center transition-colors duration-150" style="color: var(--text-tertiary);">
                      <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="w-6 h-6 rounded flex items-center justify-center transition-colors duration-150" style="color: var(--text-tertiary);">
                      <i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                <!-- File icons grid -->
                <div class="flex-1 p-3 grid grid-cols-4 gap-2 auto-rows-min content-start">
                  <!-- File items -->
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer transition-colors duration-150" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--color-primary-bg);">
                      <i data-lucide="file-text" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">周报.docx</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer transition-colors duration-150" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="file-spreadsheet" class="w-4 h-4" style="color: var(--color-green);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">预算.xlsx</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer transition-colors duration-150" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="file" class="w-4 h-4" style="color: var(--color-blue);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">方案.pdf</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer transition-colors duration-150" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="folder" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">素材</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer transition-colors duration-150" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="file-text" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">需求.docx</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer transition-colors duration-150" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="image" class="w-4 h-4" style="color: var(--color-green);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">设计稿.png</span>
                  </div>
                </div>
                <!-- Context hint (hover tooltip) -->
                <div class="fence-tooltip absolute bottom-0 left-0 right-0 opacity-0 transition-opacity duration-200 pointer-events-none" style="z-index: 5;">
                  <div class="mx-4 mb-1.5 px-2.5 py-1 rounded text-xs whitespace-nowrap" style="background: var(--surface-dark); color: var(--text-on-dark); font-family: var(--font-display); box-shadow: var(--shadow-md);">双击标题重命名 | 拖拽边缘调整大小</div>
                </div>
              </div>

              <!-- ── Fence 2: 项目资料 (locked) ── -->
                 <div class="fence-card relative rounded-lg border flex flex-col" style="background: var(--surface-0); border-color: var(--border-default); width: 300px; height: 200px; box-shadow: var(--shadow-lg);">
                  <!-- Accent stripe -->
                  <div class="absolute top-0 left-0 w-1 h-full rounded-l-lg" style="background: var(--color-blue);"></div>
                <!-- Locked badge -->
                <div class="absolute top-2 right-2 px-2 py-0.5 rounded text-xs font-medium" style="background: var(--surface-2); color: var(--text-secondary); font-family: var(--font-display); z-index: 2;">
                  <span class="flex items-center gap-1">
                    <i data-lucide="lock" class="w-3 h-3"></i>
                    已锁定
                  </span>
                </div>
                <!-- Title bar -->
                <div class="flex items-center justify-between px-4 py-2 border-b" style="border-color: var(--border-default);">
                  <div class="flex items-center gap-2">
                    <i data-lucide="archive" class="w-4 h-4" style="color: var(--color-blue);"></i>
                    <span class="text-sm font-medium" style="font-family: var(--font-display); color: var(--text-primary);">项目资料</span>
                  </div>
                  <div class="flex items-center gap-1">
                    <button class="w-6 h-6 rounded flex items-center justify-center transition-colors duration-150" style="color: var(--text-tertiary);">
                      <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="w-6 h-6 rounded flex items-center justify-center transition-colors duration-150" style="color: var(--text-tertiary);">
                      <i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                <!-- File icons grid -->
                <div class="flex-1 p-3 grid grid-cols-4 gap-2 auto-rows-min content-start">
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="file-text" class="w-4 h-4" style="color: var(--color-blue);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">合同.pdf</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="folder" class="w-4 h-4" style="color: var(--color-blue);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">原型</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="file" class="w-4 h-4" style="color: var(--color-green);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">排期.xlsx</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-1.5 rounded cursor-pointer" style="min-width: 0;">
                    <div class="w-8 h-8 rounded flex items-center justify-center" style="background: var(--surface-2);">
                      <i data-lucide="presentation" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    </div>
                    <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">汇报.pptx</span>
                  </div>
                </div>
                <!-- Context hint (hover tooltip) -->
                <div class="fence-tooltip absolute bottom-0 left-0 right-0 opacity-0 transition-opacity duration-200 pointer-events-none" style="z-index: 5;">
                  <div class="mx-4 mb-1.5 px-2.5 py-1 rounded text-xs whitespace-nowrap" style="background: var(--surface-dark); color: var(--text-on-dark); font-family: var(--font-display); box-shadow: var(--shadow-md);">双击标题重命名 | 拖拽边缘调整大小</div>
                </div>
              </div>

              <!-- ── Fence 3: 常用工具 (minimized) ── -->
              <div class="fence-card relative rounded-lg border flex flex-col" style="background: var(--surface-0); border-color: var(--border-default); width: 280px; box-shadow: var(--shadow-lg);">
                <!-- Accent stripe -->
                <div class="absolute top-0 left-0 w-1 h-full rounded-l-lg" style="background: var(--color-green);"></div>
                <!-- Minimized badge -->
                <div class="absolute top-2 right-2 px-2 py-0.5 rounded text-xs font-medium" style="background: var(--surface-2); color: var(--text-secondary); font-family: var(--font-display); z-index: 2;">
                  <span class="flex items-center gap-1">
                    <i data-lucide="chevrons-down" class="w-3 h-3"></i>
                    已最小化
                  </span>
                </div>
                <!-- Title bar (only visible part when minimized) -->
                <div class="flex items-center justify-between px-4 py-2 border-b" style="border-color: var(--border-default);">
                  <div class="flex items-center gap-2">
                    <i data-lucide="wrench" class="w-4 h-4" style="color: var(--color-green);"></i>
                    <span class="text-sm font-medium" style="font-family: var(--font-display); color: var(--text-primary);">常用工具</span>
                  </div>
                  <div class="flex items-center gap-1">
                    <button class="w-6 h-6 rounded flex items-center justify-center transition-colors duration-150" style="color: var(--text-tertiary);">
                      <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="w-6 h-6 rounded flex items-center justify-center transition-colors duration-150" style="color: var(--text-tertiary);">
                      <i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
                <!-- Minimized body placeholder -->
                <div class="px-4 py-3 flex items-center justify-center">
                  <span class="text-xs" style="color: var(--text-tertiary);">12 个项目已收起</span>
                </div>
                <!-- Context hint (hover tooltip) -->
                <div class="fence-tooltip absolute bottom-0 left-0 right-0 opacity-0 transition-opacity duration-200 pointer-events-none" style="z-index: 5;">
                  <div class="mx-4 mb-1.5 px-2.5 py-1 rounded text-xs whitespace-nowrap" style="background: var(--surface-dark); color: var(--text-on-dark); font-family: var(--font-display); box-shadow: var(--shadow-md);">双击标题重命名 | 拖拽边缘调整大小</div>
                </div>
              </div>

            </div>

            <!-- ── Floating Action Bar (bottom) ── -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-3 px-5 py-2.5 rounded-lg border" style="background: var(--surface-0); border-color: var(--border-default); box-shadow: var(--shadow-float); z-index: 10;">
              <button class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-150 whitespace-nowrap" style="font-family: var(--font-display); background: var(--color-primary); color: var(--text-on-accent);">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新建围栏</span>
              </button>
              <button class="flex items-center gap-2 px-4 py-2 rounded-lg border text-sm font-medium transition-all duration-150 whitespace-nowrap" style="font-family: var(--font-display); border-color: var(--border-default); background: transparent; color: var(--text-primary);">
                <i data-lucide="eye" class="w-4 h-4"></i>
                <span>全部显示</span>
              </button>
            </div>

          </div>

          <!-- ── Right Properties Panel ── -->
          <aside class="w-72 shrink-0 border-l flex flex-col overflow-y-auto" style="border-color: var(--border-default); background: var(--surface-1);">

            <!-- Panel header -->
            <div class="px-5 py-4 border-b" style="border-color: var(--border-default);">
              <span class="text-sm font-semibold" style="font-family: var(--font-display); color: var(--text-primary);">围栏属性</span>
            </div>

            <div class="flex-1 px-5 py-4 flex flex-col gap-5">

              <!-- ── Group: 位置与尺寸 ── -->
              <div>
                <h3 class="text-xs font-semibold mb-3 tracking-wide uppercase" style="font-family: var(--font-display); color: var(--text-tertiary); font-size: 10px; letter-spacing: 0.05em;">位置与尺寸</h3>
                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <span class="block text-xs mb-1" style="color: var(--text-tertiary);">X</span>
                    <div class="px-3 py-1.5 rounded-lg border text-sm" style="border-color: var(--border-default); background: var(--surface-0); color: var(--text-primary); font-family: var(--font-display);">120</div>
                  </div>
                  <div>
                    <span class="block text-xs mb-1" style="color: var(--text-tertiary);">Y</span>
                    <div class="px-3 py-1.5 rounded-lg border text-sm" style="border-color: var(--border-default); background: var(--surface-0); color: var(--text-primary); font-family: var(--font-display);">60</div>
                  </div>
                  <div>
                    <span class="block text-xs mb-1" style="color: var(--text-tertiary);">W</span>
                    <div class="px-3 py-1.5 rounded-lg border text-sm" style="border-color: var(--border-default); background: var(--surface-0); color: var(--text-primary); font-family: var(--font-display);">340</div>
                  </div>
                  <div>
                    <span class="block text-xs mb-1" style="color: var(--text-tertiary);">H</span>
                    <div class="px-3 py-1.5 rounded-lg border text-sm" style="border-color: var(--border-default); background: var(--surface-0); color: var(--text-primary); font-family: var(--font-display);">240</div>
                  </div>
                </div>
              </div>

              <!-- ── Group: 外观 ── -->
              <div>
                <h3 class="text-xs font-semibold mb-3 tracking-wide uppercase" style="font-family: var(--font-display); color: var(--text-tertiary); font-size: 10px; letter-spacing: 0.05em;">外观</h3>
                <div class="flex flex-col gap-4">
                  <!-- Background color dots -->
                  <div>
                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary); font-family: var(--font-display);">背景颜色</label>
                    <div class="flex items-center gap-2.5">
                      <button class="w-7 h-7 rounded-full border-2 transition-transform duration-150" style="background: var(--surface-0); border-color: var(--color-primary); width: 28px; height: 28px;"></button>
                      <button class="w-7 h-7 rounded-full border transition-transform duration-150" style="background: var(--surface-1); border-color: var(--border-default); width: 28px; height: 28px;"></button>
                      <button class="w-7 h-7 rounded-full border transition-transform duration-150" style="background: var(--surface-2); border-color: var(--border-default); width: 28px; height: 28px;"></button>
                      <button class="w-7 h-7 rounded-full border transition-transform duration-150" style="background: var(--color-primary-bg); border-color: var(--border-default); width: 28px; height: 28px;"></button>
                      <button class="w-7 h-7 rounded-full border transition-transform duration-150" style="background: var(--surface-dark); border-color: var(--border-default); width: 28px; height: 28px;"></button>
                    </div>
                  </div>
                  <!-- Opacity slider -->
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <label class="text-xs font-medium" style="color: var(--text-secondary); font-family: var(--font-display);">不透明度</label>
                      <span class="text-xs tabular-nums" style="color: var(--text-tertiary); font-family: var(--font-display);">85%</span>
                    </div>
                    <div class="w-full h-1.5 rounded-full relative" style="background: var(--surface-3);">
                      <div class="absolute left-0 top-0 h-full rounded-full" style="background: var(--color-primary); width: 85%;"></div>
                      <div class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full border-2 cursor-pointer" style="background: var(--surface-0); border-color: var(--color-primary); width: 14px; height: 14px; left: calc(85% - 7px); box-shadow: var(--shadow-sm);"></div>
                    </div>
                  </div>
                  <!-- Icon size selector -->
                  <div>
                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary); font-family: var(--font-display);">图标大小</label>
                    <div class="flex items-center gap-2">
                      <button class="px-3 py-1.5 rounded-lg border text-xs font-medium transition-colors duration-150" style="border-color: var(--border-default); background: transparent; color: var(--text-secondary); font-family: var(--font-display);">小</button>
                      <button class="px-3 py-1.5 rounded-lg border text-xs font-medium transition-colors duration-150" style="border-color: var(--color-primary); background: var(--color-primary-bg); color: var(--color-primary); font-family: var(--font-display);">中</button>
                      <button class="px-3 py-1.5 rounded-lg border text-xs font-medium transition-colors duration-150" style="border-color: var(--border-default); background: transparent; color: var(--text-secondary); font-family: var(--font-display);">大</button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── Group: 行为 ── -->
              <div>
                <h3 class="text-xs font-semibold mb-3 tracking-wide uppercase" style="font-family: var(--font-display); color: var(--text-tertiary); font-size: 10px; letter-spacing: 0.05em;">行为</h3>
                <div class="flex flex-col gap-3">
                  <div class="flex items-center justify-between">
                    <span class="text-sm" style="color: var(--text-primary);">锁定</span>
                    <div class="w-10 h-5.5 rounded-full relative cursor-pointer transition-colors duration-150" style="background: var(--surface-3); width: 40px; height: 22px;">
                      <div class="absolute top-0.5 w-4.5 h-4.5 rounded-full transition-all duration-150" style="background: var(--surface-0); width: 18px; height: 18px; left: 2px; box-shadow: var(--shadow-sm);"></div>
                    </div>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-sm" style="color: var(--text-primary);">最小化</span>
                    <div class="w-10 h-5.5 rounded-full relative cursor-pointer transition-colors duration-150" style="background: var(--surface-3); width: 40px; height: 22px;">
                      <div class="absolute top-0.5 w-4.5 h-4.5 rounded-full transition-all duration-150" style="background: var(--surface-0); width: 18px; height: 18px; left: 2px; box-shadow: var(--shadow-sm);"></div>
                    </div>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-sm" style="color: var(--text-primary);">允许最小化</span>
                    <div class="w-10 h-5.5 rounded-full relative cursor-pointer transition-colors duration-150" style="background: var(--color-primary); width: 40px; height: 22px;">
                      <div class="absolute top-0.5 w-4.5 h-4.5 rounded-full transition-all duration-150" style="background: var(--surface-0); width: 18px; height: 18px; left: 20px; box-shadow: var(--shadow-sm);"></div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </aside>

        </div>



      </div>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
