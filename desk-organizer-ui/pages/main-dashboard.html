<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主界面总览</title>
    <style id="theme-vars">
/* DeskOrganizer — Anthropic Brand CSS */
:root {
  /* ── Brand Colors ── */
  --color-dark: #141413;
  --color-light: #faf9f5;
  --color-mid-gray: #b0aea5;
  --color-light-gray: #e8e6dc;
  --color-orange: #d97757;
  --color-blue: #6a9bcc;
  --color-green: #788c5d;

  /* ── Primary palette tints ── */
  --color-primary: #d97757;
  --color-primary-hover: #c4683f;
  --color-primary-light: #f5e0d6;
  --color-primary-bg: #fdf8f5;

  /* ── Semantic state colors ── */
  --state-success: #788c5d;
  --state-warning: #d97757;
  --state-error: #c75050;
  --state-info: #6a9bcc;

  /* ── Surface system ── */
  --surface-0: #faf9f5;
  --surface-1: #f3f1eb;
  --surface-2: #e8e6dc;
  --surface-3: #d4d2c8;
  --surface-dark: #1e1e1c;
  --surface-dark-elevated: #2a2a27;

  /* ── Text ── */
  --text-primary: #141413;
  --text-secondary: #6b6963;
  --text-tertiary: #b0aea5;
  --text-on-dark: #faf9f5;
  --text-on-accent: #faf9f5;

  /* ── Borders ── */
  --border-default: #e8e6dc;
  --border-strong: #d4d2c8;
  --border-focus: #d97757;

  /* ── Typography ── */
  --font-display: 'Poppins', 'Arial', sans-serif;
  --font-body: 'Lora', 'Georgia', serif;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* ── Spacing ── */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadows (alpha ≤ 0.05 for static) ── */
  --shadow-sm: 0 1px 2px rgba(20, 20, 19, 0.04);
  --shadow-md: 0 2px 8px rgba(20, 20, 19, 0.04);
  --shadow-lg: 0 4px 16px rgba(20, 20, 19, 0.05);
  --shadow-float: 0 8px 32px rgba(20, 20, 19, 0.12);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

/* Dark mode tokens */
html.dark {
  --surface-0: #141413;
  --surface-1: #1e1e1c;
  --surface-2: #2a2a27;
  --surface-3: #3a3a36;
  --text-primary: #faf9f5;
  --text-secondary: #b0aea5;
  --text-tertiary: #6b6963;
  --border-default: #2a2a27;
  --border-strong: #3a3a36;
  --primary-light: #3d2a20;
  --primary-bg: #221a14;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-body);">
    <main class="flex min-h-screen">

      <!-- ── Left Sidebar ── -->
      <aside class="w-60 shrink-0 border-r flex flex-col" style="border-color: var(--border-default); background: var(--surface-1);">
        <!-- App Logo -->
        <div class="px-6 py-5 border-b" style="border-color: var(--border-default);">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--color-primary);">
              <i data-lucide="layout-grid" class="w-4 h-4" style="color: var(--text-on-accent);"></i>
            </div>
            <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-display); color: var(--text-primary);">DeskOrganizer</span>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-3 py-4 flex flex-col gap-1">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium" style="font-family: var(--font-display); background: var(--color-primary-bg); color: var(--color-primary);" data-active="true">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>主界面</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);" data-dom-id="nav-fences">
            <i data-lucide="grid-3x3" class="w-4 h-4"></i>
            <span>桌面围栏</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);" data-dom-id="nav-search">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>全局搜索</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);">
            <i data-lucide="sticky-note" class="w-4 h-4"></i>
            <span>便签</span>
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150" style="font-family: var(--font-display); color: var(--text-secondary);">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>设置</span>
          </a>
        </nav>

        <!-- Sidebar footer -->
        <div class="px-6 py-4 border-t" style="border-color: var(--border-default);">
          <span class="text-xs" style="color: var(--text-tertiary);">v1.0.0</span>
        </div>
      </aside>

      <!-- ── Main Content Area ── -->
      <div class="flex-1 flex flex-col overflow-auto">

        <!-- ── Top Bar ── -->
        <header class="h-14 shrink-0 border-b flex items-center justify-between px-6" style="border-color: var(--border-default); background: var(--surface-0);">
          <div class="flex items-center gap-3">
            <span class="text-base font-semibold" style="font-family: var(--font-display); color: var(--text-primary);">主界面总览</span>
          </div>
          <div class="flex items-center gap-4">
            <!-- Search quick-access -->
            <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs transition-colors duration-150" style="border-color: var(--border-default); background: var(--surface-1); color: var(--text-secondary);">
              <i data-lucide="search" class="w-3.5 h-3.5"></i>
              <span>快速搜索</span>
              <kbd class="px-1.5 py-0.5 rounded text-xs" style="background: var(--surface-2); color: var(--text-tertiary); font-size: 10px;">Alt+Space</kbd>
            </button>
            <!-- User avatar -->
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold" style="background: var(--color-primary); color: var(--text-on-accent); font-family: var(--font-display);">
              U
            </div>
          </div>
        </header>

        <!-- ── Scrollable Content ── -->
        <div class="flex-1 overflow-auto p-6" style="background: var(--surface-0);">

          <!-- ── Quick Stats Row ── -->
          <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <!-- Stat: Active Fences -->
            <div class="rounded-lg border-l-4 p-5 flex items-center gap-4" style="background: var(--surface-1); border-color: var(--color-primary); border-top: none; border-right: none; border-bottom: none;">
              <div class="flex-1 min-w-0">
                <p class="text-xs font-medium mb-1 truncate" style="color: var(--text-secondary); font-family: var(--font-display);">活跃围栏</p>
                <p class="text-2xl font-semibold tabular-nums" style="font-family: var(--font-display); color: var(--text-primary);">4</p>
              </div>
            </div>
            <!-- Stat: Sticky Notes -->
            <div class="rounded-lg border-l-4 p-5 flex items-center gap-4" style="background: var(--surface-1); border-color: var(--color-blue); border-top: none; border-right: none; border-bottom: none;">
              <div class="flex-1 min-w-0">
                <p class="text-xs font-medium mb-1 truncate" style="color: var(--text-secondary); font-family: var(--font-display);">便签数</p>
                <p class="text-2xl font-semibold tabular-nums" style="font-family: var(--font-display); color: var(--text-primary);">7</p>
              </div>
            </div>
            <!-- Stat: Indexed Files -->
            <div class="rounded-lg border-l-4 p-5 flex items-center gap-4" style="background: var(--surface-1); border-color: var(--color-green); border-top: none; border-right: none; border-bottom: none;">
              <div class="flex-1 min-w-0">
                <p class="text-xs font-medium mb-1 truncate" style="color: var(--text-secondary); font-family: var(--font-display);">已索引文件</p>
                <p class="text-2xl font-semibold tabular-nums" style="font-family: var(--font-display); color: var(--text-primary);">12,847</p>
              </div>
            </div>
          </section>

          <!-- ── Recent Fences Grid (2x2) ── -->
          <section class="mb-6">
            <h2 class="text-lg font-semibold mb-4" style="font-family: var(--font-display); color: var(--text-primary);">最近围栏</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4">
              <!-- Fence: 工作文件 -->
              <div class="rounded-lg border p-4 flex items-center gap-3 transition-colors duration-150 cursor-pointer" style="background: var(--surface-1); border-color: var(--border-default);">
                <div class="w-2 h-2 rounded-full shrink-0" style="background: var(--color-primary);"></div>
                <div class="flex-1 min-w-0">
                  <h3 class="text-sm font-semibold truncate" style="font-family: var(--font-display); color: var(--text-primary);">工作文件</h3>
                  <p class="text-xs mt-1 truncate" style="color: var(--text-secondary);">32 个文件</p>
                </div>
              </div>
              <!-- Fence: 项目资料 -->
              <div class="rounded-lg border p-4 flex items-center gap-3 transition-colors duration-150 cursor-pointer" style="background: var(--surface-1); border-color: var(--border-default);">
                <div class="w-2 h-2 rounded-full shrink-0" style="background: var(--color-blue);"></div>
                <div class="flex-1 min-w-0">
                  <h3 class="text-sm font-semibold truncate" style="font-family: var(--font-display); color: var(--text-primary);">项目资料</h3>
                  <p class="text-xs mt-1 truncate" style="color: var(--text-secondary);">18 个文件</p>
                </div>
              </div>
              <!-- Fence: 常用工具 -->
              <div class="rounded-lg border p-4 flex items-center gap-3 transition-colors duration-150 cursor-pointer" style="background: var(--surface-1); border-color: var(--border-default);">
                <div class="w-2 h-2 rounded-full shrink-0" style="background: var(--color-green);"></div>
                <div class="flex-1 min-w-0">
                  <h3 class="text-sm font-semibold truncate" style="font-family: var(--font-display); color: var(--text-primary);">常用工具</h3>
                  <p class="text-xs mt-1 truncate" style="color: var(--text-secondary);">12 个文件</p>
                </div>
              </div>
              <!-- Fence: 临时文件 -->
              <div class="rounded-lg border p-4 flex items-center gap-3 transition-colors duration-150 cursor-pointer" style="background: var(--surface-1); border-color: var(--border-default);">
                <div class="w-2 h-2 rounded-full shrink-0" style="background: var(--text-tertiary);"></div>
                <div class="flex-1 min-w-0">
                  <h3 class="text-sm font-semibold truncate" style="font-family: var(--font-display); color: var(--text-primary);">临时文件</h3>
                  <p class="text-xs mt-1 truncate" style="color: var(--text-secondary);">8 个文件</p>
                </div>
              </div>
            </div>
          </section>

          <!-- ── Recent Sticky Notes ── -->
          <section class="mb-6">
            <h2 class="text-lg font-semibold mb-4" style="font-family: var(--font-display); color: var(--text-primary);">最近便签</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <!-- Note: 会议纪要 -->
              <div class="rounded-lg p-5 transition-colors duration-150 cursor-pointer border-l-4" style="background: var(--color-primary-bg); border-color: var(--color-primary); border-top: none; border-right: none; border-bottom: none;">
                <h3 class="text-sm font-semibold mb-2 truncate" style="font-family: var(--font-display); color: var(--text-primary);">会议纪要</h3>
                <p class="text-xs line-clamp-3" style="color: var(--text-secondary); line-height: var(--leading-normal);">下周三产品评审，需准备竞品分析报告和用户调研数据汇总。</p>
              </div>
              <!-- Note: 待办事项 -->
              <div class="rounded-lg p-5 transition-colors duration-150 cursor-pointer border-l-4" style="background: var(--surface-1); border-color: var(--color-blue); border-top: none; border-right: none; border-bottom: none;">
                <h3 class="text-sm font-semibold mb-2 truncate" style="font-family: var(--font-display); color: var(--text-primary);">待办事项</h3>
                <p class="text-xs line-clamp-3" style="color: var(--text-secondary); line-height: var(--leading-normal);">1. 整理桌面图标布局 2. 备份项目文档 3. 更新快捷方式</p>
              </div>
              <!-- Note: 灵感记录 -->
              <div class="rounded-lg p-5 transition-colors duration-150 cursor-pointer border-l-4" style="background: var(--surface-1); border-color: var(--color-green); border-top: none; border-right: none; border-bottom: none;">
                <h3 class="text-sm font-semibold mb-2 truncate" style="font-family: var(--font-display); color: var(--text-primary);">灵感记录</h3>
                <p class="text-xs line-clamp-3" style="color: var(--text-secondary); line-height: var(--leading-normal);">考虑用文件夹颜色编码区分项目优先级，红色高优，蓝色普通。</p>
              </div>
            </div>
          </section>

        </div>
      </div>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
